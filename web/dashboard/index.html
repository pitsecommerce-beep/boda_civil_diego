<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Invitados · Mariana & Diego</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --black:#0a0a0a; --white:#fafafa; --gray:#666; --line:#ddd; --ok:#1f6f43; --no:#9b2c2c; --pend:#8a6d1d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--white); color:var(--black); font-family:'Inter',sans-serif; font-weight:300; line-height:1.5; }
    h1,h2 { font-family:'Cormorant Garamond',serif; font-weight:300; }
    button,input,select,textarea { font:inherit; color:inherit; }
    .btn { padding:.6rem 1rem; border:1px solid var(--black); background:transparent; cursor:pointer; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; }
    .btn:hover, .btn.primary { background:var(--black); color:var(--white); }
    .btn.primary:hover { opacity:.85; }
    .btn.sm { padding:.35rem .6rem; font-size:.62rem; }
    .btn.danger { border-color:var(--no); color:var(--no); }
    .btn.danger:hover { background:var(--no); color:var(--white); }
    input,select,textarea { padding:.6rem .7rem; border:1px solid var(--black); background:transparent; border-radius:0; width:100%; }

    /* Login */
    #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .login-box { width:100%; max-width:360px; border:1px solid var(--black); padding:2.5rem 1.8rem; text-align:center; }
    .login-box h1 { font-size:2.4rem; line-height:1; margin-bottom:.4rem; }
    .login-box p { font-size:.7rem; letter-spacing:.3em; text-transform:uppercase; color:var(--gray); margin-bottom:1.8rem; }
    .login-box form { display:flex; flex-direction:column; gap:.7rem; }
    .msg { font-size:.85rem; margin-top:.8rem; color:var(--no); }

    /* App */
    #app { display:none; max-width:1200px; margin:0 auto; padding:1.5rem 1rem 4rem; }
    header { display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap; border-bottom:1px solid var(--black); padding-bottom:1rem; margin-bottom:1.5rem; }
    header h1 { font-size:2.2rem; line-height:1; }
    header small { display:block; font-size:.65rem; letter-spacing:.3em; text-transform:uppercase; color:var(--gray); margin-bottom:.3rem; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:.8rem; margin-bottom:1.5rem; }
    .stat { border:1px solid var(--line); padding:1rem; cursor:pointer; }
    .stat.active { border-color:var(--black); }
    .stat .n { font-family:'Cormorant Garamond',serif; font-size:2.2rem; line-height:1; }
    .stat .l { font-size:.65rem; letter-spacing:.15em; text-transform:uppercase; color:var(--gray); margin-top:.3rem; }
    .stat .sub { font-size:.75rem; color:var(--gray); }
    .bar { height:6px; display:flex; background:var(--line); margin:-.5rem 0 1.5rem; }
    .bar span { display:block; height:100%; }
    .toolbar { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem; align-items:center; }
    .toolbar input[type=search] { flex:1 1 220px; width:auto; }
    .toolbar select { width:auto; }
    .toolbar .spacer { flex:1; }
    .table-wrap { overflow-x:auto; border:1px solid var(--line); }
    table { width:100%; border-collapse:collapse; font-size:.85rem; }
    th,td { padding:.6rem .7rem; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-weight:500; font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gray); background:#f3f3f3; position:sticky; top:0; }
    td.msgcell { max-width:260px; color:var(--gray); font-size:.8rem; }
    td.actions { white-space:nowrap; }
    td.actions .btn { margin:0 .2rem .2rem 0; }
    .badge { display:inline-block; padding:.15rem .5rem; font-size:.65rem; letter-spacing:.08em; text-transform:uppercase; border:1px solid; white-space:nowrap; }
    .badge.confirmado { color:var(--ok); }
    .badge.no_asiste { color:var(--no); }
    .badge.pendiente { color:var(--pend); }
    .empty { padding:2rem; text-align:center; color:var(--gray); }
    .slug { font-size:.72rem; color:var(--gray); }

    dialog { border:1px solid var(--black); padding:1.8rem; max-width:440px; width:calc(100% - 2rem); margin:auto; background:var(--white); }
    dialog::backdrop { background:rgba(0,0,0,.55); }
    dialog h2 { font-size:1.7rem; margin-bottom:1rem; }
    dialog form { display:flex; flex-direction:column; gap:.7rem; }
    dialog label { font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gray); display:flex; flex-direction:column; gap:.3rem; }
    dialog .row { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
    dialog .actions { display:flex; gap:.5rem; justify-content:flex-end; margin-top:.5rem; }
    .help { font-size:.8rem; color:var(--gray); line-height:1.5; }

    #toast { position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%); background:var(--black); color:var(--white); padding:.7rem 1.2rem; font-size:.85rem; opacity:0; transition:opacity .25s; pointer-events:none; z-index:50; max-width:90vw; }
    #toast.show { opacity:1; }
    @media (max-width:600px) { header h1 { font-size:1.8rem; } dialog .row { grid-template-columns:1fr; } }
  </style>
</head>
<body>

  <section id="login">
    <div class="login-box">
      <h1>Mariana &amp; Diego</h1>
      <p>Lista de invitados</p>
      <form id="login-form">
        <input type="email" id="email" placeholder="Correo" required autocomplete="email">
        <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
        <button class="btn primary" type="submit">Entrar</button>
      </form>
      <div class="msg" id="login-msg"></div>
    </div>
  </section>

  <main id="app">
    <header>
      <div>
        <small>Boda civil · 13 de marzo de 2027</small>
        <h1>Invitados</h1>
      </div>
      <div class="toolbar" style="margin:0">
        <span class="slug" id="who"></span>
        <button class="btn sm" id="btn-bank">Mesa de regalos</button>
        <button class="btn sm" id="btn-logout">Salir</button>
      </div>
    </header>

    <div class="stats" id="stats"></div>
    <div class="bar" id="bar"></div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Buscar por nombre, grupo o teléfono">
      <select id="filter">
        <option value="">Todos</option>
        <option value="confirmado">Confirmados</option>
        <option value="no_asiste">No asisten</option>
        <option value="pendiente">Pendientes</option>
      </select>
      <button class="btn" id="btn-add">Agregar</button>
      <button class="btn" id="btn-import">Cargar Excel</button>
      <button class="btn" id="btn-export">Descargar Excel</button>
      <button class="btn" id="btn-template">Plantilla</button>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Invitado</th><th>Grupo</th><th>Pases</th><th>Estado</th><th>Asisten</th><th>Mensaje</th><th>Respondió</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <dialog id="dlg-guest">
    <h2 id="dlg-title">Invitado</h2>
    <form id="guest-form" method="dialog">
      <input type="hidden" id="g-id">
      <label>Nombre<input id="g-nombre" required></label>
      <label>Link (se genera del nombre)<input id="g-slug" placeholder="juan-perez"></label>
      <div class="row">
        <label>Teléfono<input id="g-telefono" inputmode="tel"></label>
        <label>Pases<input id="g-pases" type="number" min="1" value="1" required></label>
      </div>
      <label>Grupo<input id="g-grupo" placeholder="Familia, amigos..."></label>
      <div class="row">
        <label>Estado
          <select id="g-estado">
            <option value="pendiente">Pendiente</option>
            <option value="confirmado">Confirmado</option>
            <option value="no_asiste">No asiste</option>
          </select>
        </label>
        <label>Asisten<input id="g-asistentes" type="number" min="0"></label>
      </div>
      <label>Notas<textarea id="g-notas" rows="2"></textarea></label>
      <div class="actions">
        <button class="btn" type="button" id="g-cancel">Cancelar</button>
        <button class="btn primary" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-import">
    <h2>Cargar Excel</h2>
    <p class="help" id="import-summary"></p>
    <div class="actions" style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem">
      <button class="btn" id="imp-cancel">Cancelar</button>
      <button class="btn primary" id="imp-ok">Importar</button>
    </div>
  </dialog>

  <dialog id="dlg-bank">
    <h2>Mesa de regalos</h2>
    <p class="help" style="margin-bottom:1rem">Estos datos aparecen en la invitación, dentro de "Mesa de regalos".</p>
    <form id="bank-form" method="dialog">
      <label>Banco<input id="b-banco" placeholder="BBVA"></label>
      <label>Titular<input id="b-titular" placeholder="Nombre del titular"></label>
      <label>CLABE (18 dígitos)<input id="b-clabe" inputmode="numeric" maxlength="22" placeholder="012345678901234567"></label>
      <div class="actions">
        <button class="btn" type="button" id="b-cancel">Cancelar</button>
        <button class="btn primary" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="toast"></div>

  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
  (function () {
    var cfg = window.BODA_CONFIG || {};
    var $ = function (id) { return document.getElementById(id); };
    var ESTADOS = { pendiente: 'Pendiente', confirmado: 'Confirmado', no_asiste: 'No asiste' };

    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
      $('login-msg').textContent = 'Falta configurar SUPABASE_URL y SUPABASE_ANON_KEY en GitHub.';
      return;
    }
    var sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    var guests = [];
    var pendingImport = [];

    // ---------- utilidades ----------
    function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('show'); }, 2200); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
    function slugify(s) { return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60); }
    function siteBase() {
      if (cfg.siteUrl) return cfg.siteUrl.replace(/\/$/, '');
      return location.origin + (cfg.basePath || '').replace(/\/$/, '');
    }
    function linkFor(g) { return siteBase() + '/' + g.slug; }
    function phoneIntl(t) {
      var d = String(t || '').replace(/\D/g, '');
      if (!d) return '';
      if (d.length === 10) d = '52' + d;
      return d;
    }
    function fmtDate(d) { return d ? new Date(d).toLocaleString('es-MX', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''; }
    function copy(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      return Promise.resolve();
    }
    function inviteText(g) {
      return '¡Hola ' + g.nombre + '! Con mucho cariño te compartimos la invitación a nuestra boda civil el 13 de marzo de 2027. ' +
        'Por favor confirma tu asistencia aquí: ' + linkFor(g) + '\n\nMariana & Diego';
    }

    // ---------- autenticación ----------
    $('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      $('login-msg').textContent = '';
      sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value })
        .then(function (r) { if (r.error) throw r.error; return start(r.data.session); })
        .catch(function (err) { $('login-msg').textContent = 'No se pudo entrar: ' + (err.message || err); });
    });
    $('btn-logout').addEventListener('click', function () { sb.auth.signOut().then(function () { location.reload(); }); });

    function start(session) {
      if (!session) return;
      return sb.rpc('es_admin').then(function (r) {
        if (r.error) throw r.error;
        if (!r.data) {
          sb.auth.signOut();
          $('login-msg').textContent = 'Este correo no tiene acceso. Agrégalo a la tabla admins en Supabase.';
          return;
        }
        $('login').style.display = 'none';
        $('app').style.display = 'block';
        $('who').textContent = session.user.email;
        load();
        sb.channel('invitados').on('postgres_changes', { event: '*', schema: 'public', table: 'invitados' }, function () { load(); }).subscribe();
        setInterval(load, 60000);
      });
    }
    sb.auth.getSession().then(function (r) { start(r.data.session); });

    // ---------- datos ----------
    function load() {
      return sb.from('invitados').select('*').order('nombre').then(function (r) {
        if (r.error) { toast('Error al cargar: ' + r.error.message); return; }
        guests = r.data || [];
        render();
      });
    }

    function render() {
      var c = { total: guests.length, confirmado: 0, no_asiste: 0, pendiente: 0, pases: 0, personas: 0 };
      guests.forEach(function (g) { c[g.estado]++; c.pases += g.pases || 0; if (g.estado === 'confirmado') c.personas += g.asistentes || 0; });
      var f = $('filter').value;
      var cards = [
        { k: '', n: c.total, l: 'Invitaciones', sub: c.pases + ' pases' },
        { k: 'confirmado', n: c.confirmado, l: 'Confirmados', sub: c.personas + ' personas' },
        { k: 'no_asiste', n: c.no_asiste, l: 'No asisten', sub: '' },
        { k: 'pendiente', n: c.pendiente, l: 'Pendientes', sub: '' }
      ];
      $('stats').innerHTML = cards.map(function (s) {
        return '<div class="stat' + (f === s.k ? ' active' : '') + '" data-k="' + s.k + '"><div class="n">' + s.n + '</div><div class="l">' + s.l + '</div><div class="sub">' + s.sub + '</div></div>';
      }).join('');
      var pct = function (n) { return c.total ? (n / c.total * 100) : 0; };
      $('bar').innerHTML = '<span style="width:' + pct(c.confirmado) + '%;background:var(--ok)"></span><span style="width:' + pct(c.no_asiste) + '%;background:var(--no)"></span>';

      var q = norm($('search').value);
      var list = guests.filter(function (g) {
        if (f && g.estado !== f) return false;
        if (!q) return true;
        return norm([g.nombre, g.grupo, g.telefono, g.slug].join(' ')).indexOf(q) !== -1;
      });
      if (!list.length) { $('rows').innerHTML = '<tr><td colspan="8" class="empty">' + (guests.length ? 'Sin resultados' : 'Aún no hay invitados. Carga tu Excel o agrega uno.') + '</td></tr>'; return; }
      $('rows').innerHTML = list.map(function (g) {
        var tel = phoneIntl(g.telefono);
        return '<tr data-id="' + g.id + '">' +
          '<td><strong style="font-weight:500">' + esc(g.nombre) + '</strong><div class="slug">/' + esc(g.slug) + '</div>' + (g.telefono ? '<div class="slug">' + esc(g.telefono) + '</div>' : '') + '</td>' +
          '<td>' + esc(g.grupo) + '</td>' +
          '<td>' + g.pases + '</td>' +
          '<td><span class="badge ' + g.estado + '">' + ESTADOS[g.estado] + '</span></td>' +
          '<td>' + (g.estado === 'confirmado' ? (g.asistentes || 0) : '') + '</td>' +
          '<td class="msgcell">' + esc(g.mensaje) + '</td>' +
          '<td class="slug">' + fmtDate(g.respondido_at) + '</td>' +
          '<td class="actions">' +
            '<button class="btn sm primary" data-act="copy">Copiar link</button>' +
            '<button class="btn sm" data-act="text">Copiar mensaje</button>' +
            (tel ? '<button class="btn sm" data-act="wa">WhatsApp</button>' : '') +
            '<button class="btn sm" data-act="edit">Editar</button>' +
            '<button class="btn sm danger" data-act="del">Borrar</button>' +
          '</td></tr>';
      }).join('');
    }

    $('search').addEventListener('input', render);
    $('filter').addEventListener('change', render);
    $('stats').addEventListener('click', function (e) {
      var s = e.target.closest('.stat'); if (!s) return;
      $('filter').value = s.dataset.k; render();
    });

    $('rows').addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]'); if (!b) return;
      var id = b.closest('tr').dataset.id;
      var g = guests.find(function (x) { return x.id === id; });
      if (!g) return;
      var act = b.dataset.act;
      if (act === 'copy') copy(linkFor(g)).then(function () { toast('Link copiado: ' + linkFor(g)); });
      if (act === 'text') copy(inviteText(g)).then(function () { toast('Mensaje copiado'); });
      if (act === 'wa') window.open('https://wa.me/' + phoneIntl(g.telefono) + '?text=' + encodeURIComponent(inviteText(g)), '_blank');
      if (act === 'edit') openGuest(g);
      if (act === 'del' && confirm('¿Borrar a ' + g.nombre + '?')) {
        sb.from('invitados').delete().eq('id', id).then(function (r) { if (r.error) return toast(r.error.message); toast('Invitado borrado'); load(); });
      }
    });

    // ---------- alta / edición ----------
    var dlg = $('dlg-guest');
    function openGuest(g) {
      g = g || {};
      $('dlg-title').textContent = g.id ? 'Editar invitado' : 'Nuevo invitado';
      $('g-id').value = g.id || '';
      $('g-nombre').value = g.nombre || '';
      $('g-slug').value = g.slug || '';
      $('g-telefono').value = g.telefono || '';
      $('g-pases').value = g.pases || 1;
      $('g-grupo').value = g.grupo || '';
      $('g-estado').value = g.estado || 'pendiente';
      $('g-asistentes').value = g.asistentes == null ? '' : g.asistentes;
      $('g-notas').value = g.notas || '';
      $('g-slug').dataset.auto = g.id ? '0' : '1';
      dlg.showModal();
    }
    $('g-nombre').addEventListener('input', function () { if ($('g-slug').dataset.auto === '1') $('g-slug').value = slugify(this.value); });
    $('g-slug').addEventListener('input', function () { this.dataset.auto = '0'; });
    $('btn-add').addEventListener('click', function () { openGuest(null); });
    $('g-cancel').addEventListener('click', function () { dlg.close(); });
    $('guest-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var id = $('g-id').value;
      var estado = $('g-estado').value;
      var asis = $('g-asistentes').value;
      var row = {
        nombre: $('g-nombre').value.trim(),
        slug: slugify($('g-slug').value || $('g-nombre').value),
        telefono: $('g-telefono').value.trim() || null,
        pases: Math.max(1, parseInt($('g-pases').value, 10) || 1),
        grupo: $('g-grupo').value.trim() || null,
        notas: $('g-notas').value.trim() || null,
        estado: estado,
        asistentes: estado === 'pendiente' ? null : (asis === '' ? (estado === 'confirmado' ? parseInt($('g-pases').value, 10) || 1 : 0) : parseInt(asis, 10)),
        updated_at: new Date().toISOString()
      };
      if (!row.slug) return toast('El link no puede estar vacío');
      var prev = guests.find(function (x) { return x.id === id; });
      if (estado !== 'pendiente' && (!prev || prev.estado !== estado)) row.respondido_at = new Date().toISOString();
      if (estado === 'pendiente') row.respondido_at = null;
      var q = id ? sb.from('invitados').update(row).eq('id', id) : sb.from('invitados').insert(row);
      q.then(function (r) {
        if (r.error) return toast(r.error.code === '23505' ? 'Ya existe un invitado con ese link' : r.error.message);
        dlg.close(); toast('Guardado'); load();
      });
    });

    // ---------- Mesa de regalos ----------
    var dlgBank = $('dlg-bank');
    $('btn-bank').addEventListener('click', function () {
      sb.from('datos_regalo').select('banco,titular,clabe').eq('id', 1).maybeSingle().then(function (r) {
        if (r.error) return toast(r.error.message);
        var d = r.data || {};
        $('b-banco').value = d.banco || '';
        $('b-titular').value = d.titular || '';
        $('b-clabe').value = d.clabe || '';
        dlgBank.showModal();
      });
    });
    $('b-cancel').addEventListener('click', function () { dlgBank.close(); });
    $('bank-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var clabe = $('b-clabe').value.replace(/\D/g, '');
      if (clabe && clabe.length !== 18) return toast('La CLABE debe tener 18 dígitos');
      sb.from('datos_regalo').upsert({
        id: 1,
        banco: $('b-banco').value.trim() || null,
        titular: $('b-titular').value.trim() || null,
        clabe: clabe || null,
        updated_at: new Date().toISOString()
      }).then(function (r) {
        if (r.error) return toast(r.error.message);
        dlgBank.close(); toast('Datos bancarios guardados');
      });
    });

    // ---------- Excel ----------
    var HEADERS = ['Nombre', 'Teléfono', 'Pases', 'Grupo', 'Notas'];
    function pick(row, keys) {
      for (var k in row) { if (keys.indexOf(norm(k)) !== -1 && String(row[k]).trim() !== '') return String(row[k]).trim(); }
      return '';
    }

    $('btn-template').addEventListener('click', function () {
      var ws = XLSX.utils.aoa_to_sheet([HEADERS, ['Juan Pérez', '5512345678', 2, 'Familia Diego', ''], ['Ana López', '5587654321', 1, 'Amigos Mariana', '']]);
      ws['!cols'] = [{ wch: 28 }, { wch: 14 }, { wch: 7 }, { wch: 20 }, { wch: 30 }];
      var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Invitados');
      XLSX.writeFile(wb, 'plantilla-invitados.xlsx');
    });

    $('btn-export').addEventListener('click', function () {
      var data = guests.map(function (g) {
        return {
          'Nombre': g.nombre, 'Teléfono': g.telefono || '', 'Pases': g.pases, 'Grupo': g.grupo || '', 'Notas': g.notas || '',
          'Estado': ESTADOS[g.estado], 'Asisten': g.estado === 'confirmado' ? (g.asistentes || 0) : (g.estado === 'no_asiste' ? 0 : ''),
          'Mensaje': g.mensaje || '', 'Respondió': g.respondido_at ? new Date(g.respondido_at).toLocaleString('es-MX') : '',
          'Slug': g.slug, 'Link': linkFor(g)
        };
      });
      var ws = XLSX.utils.json_to_sheet(data, { header: HEADERS.concat(['Estado', 'Asisten', 'Mensaje', 'Respondió', 'Slug', 'Link']) });
      ws['!cols'] = [{ wch: 28 }, { wch: 14 }, { wch: 7 }, { wch: 20 }, { wch: 24 }, { wch: 12 }, { wch: 8 }, { wch: 40 }, { wch: 18 }, { wch: 22 }, { wch: 50 }];
      var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Invitados');
      XLSX.writeFile(wb, 'invitados-mariana-diego-' + new Date().toISOString().slice(0, 10) + '.xlsx');
    });

    $('btn-import').addEventListener('click', function () { $('file').value = ''; $('file').click(); });
    $('file').addEventListener('change', function () {
      var f = this.files[0]; if (!f) return;
      f.arrayBuffer().then(function (buf) {
        var wb = XLSX.read(buf, { type: 'array' });
        var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
        var seen = {}, out = [], skipped = 0;
        rows.forEach(function (r) {
          var nombre = pick(r, ['nombre', 'invitado', 'nombre completo', 'name']);
          if (!nombre) { skipped++; return; }
          var base = slugify(pick(r, ['slug']) || nombre);
          if (!base) { skipped++; return; }
          var slug = base, i = 2;
          while (seen[slug]) slug = base + '-' + (i++);
          seen[slug] = true;
          out.push({
            slug: slug,
            nombre: nombre,
            telefono: pick(r, ['telefono', 'celular', 'whatsapp', 'tel']) || null,
            pases: Math.max(1, parseInt(pick(r, ['pases', 'lugares', 'boletos', 'personas']), 10) || 1),
            grupo: pick(r, ['grupo', 'mesa', 'familia', 'categoria']) || null,
            notas: pick(r, ['notas', 'nota', 'comentarios']) || null,
            updated_at: new Date().toISOString()
          });
        });
        var existing = {}; guests.forEach(function (g) { existing[g.slug] = true; });
        var nuevos = out.filter(function (r) { return !existing[r.slug]; }).length;
        pendingImport = out;
        $('import-summary').innerHTML = 'Se encontraron <strong>' + out.length + '</strong> invitados en el archivo.<br>' +
          nuevos + ' nuevos y ' + (out.length - nuevos) + ' se actualizarán (sin cambiar su confirmación).' +
          (skipped ? '<br>' + skipped + ' filas sin nombre se omitirán.' : '') +
          '<br><br>Columnas reconocidas: Nombre, Teléfono, Pases, Grupo, Notas.';
        $('dlg-import').showModal();
      }).catch(function (err) { toast('No se pudo leer el archivo: ' + err.message); });
    });
    $('imp-cancel').addEventListener('click', function () { $('dlg-import').close(); });
    $('imp-ok').addEventListener('click', function () {
      if (!pendingImport.length) return $('dlg-import').close();
      this.disabled = true; var btn = this;
      sb.from('invitados').upsert(pendingImport, { onConflict: 'slug' }).then(function (r) {
        btn.disabled = false; $('dlg-import').close();
        if (r.error) return toast('Error al importar: ' + r.error.message);
        toast(pendingImport.length + ' invitados importados'); pendingImport = []; load();
      });
    });
  })();
  </script>
</body>
</html>
